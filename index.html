<!doctype html>
<!-- GSXP Lead Capture | VERSION 1.9 | 17 Nov 2026 | supplier contacts (separate CSV, not in HubSpot export) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F152F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GS Leads">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GSXP Lead Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F152F;
  --bg:#F5F6FB; --surface:#FFFFFF; --surface2:#ECEFF8; --ink:#0F152F; --muted:#586082; --line:#DADEEE;
  --teal:#35D6D0; --violet:#7B5CF0; --rose:#E8507A; --coral:#F4845A;
  --primary:#6446E0; --primary-ink:#FFFFFF;
  --hot:#D93A68; --warm:#E8703F; --cold:#13A39D;
  --ok:#0E8F6B; --bad:#C93434;
  --grad:linear-gradient(90deg,#35D6D0 0%,#7B5CF0 38%,#E8507A 72%,#F4845A 100%);
  --cap-bg:#0F152F; --cap-ink:#FFFFFF;
  --head:'General Sans','Manrope','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1026; --surface:#151B3B; --surface2:#1E2550; --ink:#F1F3FF; --muted:#9FA8CF; --line:#2B3364;
    --primary:#8A6FFF; --primary-ink:#0B1026;
    --hot:#FF6F96; --warm:#FF9A6E; --cold:#35D6D0;
    --ok:#3DDBA9; --bad:#FF7B7B;
    --cap-bg:#1E2550; --cap-ink:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1026; --surface:#151B3B; --surface2:#1E2550; --ink:#F1F3FF; --muted:#9FA8CF; --line:#2B3364;
  --primary:#8A6FFF; --primary-ink:#0B1026;
  --hot:#FF6F96; --warm:#FF9A6E; --cold:#35D6D0;
  --ok:#3DDBA9; --bad:#FF7B7B;
  --cap-bg:#1E2550; --cap-ink:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;position:relative}

/* header */
.top{padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--grad)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;max-width:58%;min-height:44px}
.who i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.who span{font-size:13px;line-height:1.2;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* main */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--head);font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
h3{font-family:var(--head);font-size:16px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* nav */
nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative;min-height:56px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--primary)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge:empty{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;font-weight:600;min-height:48px;text-align:center}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5}

.capture-btn{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;border:3px solid transparent;background:linear-gradient(var(--cap-bg),var(--cap-bg)) padding-box,var(--grad) border-box;color:var(--cap-ink);cursor:pointer}
.capture-btn svg{flex:none;width:36px;height:36px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.capture-btn b{display:block;font-family:var(--head);font-size:19px;line-height:1.2}
.capture-btn span{display:block;font-size:13px;opacity:.8;margin-top:2px}
.link-btn{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0}

/* photo block */
.photo-row{display:flex;gap:14px;align-items:flex-start}
.thumb{flex:none;width:96px;height:120px;object-fit:cover;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.skeleton{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.photo-info{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.status{margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.wait{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--muted)}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=password],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.notes-wrap{position:relative}
.mic{display:none;position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);place-items:center}
.has-dict .mic{display:grid}
.mic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mic[aria-pressed="true"]{background:var(--rose);color:#fff;border-color:transparent}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 0;min-height:44px;display:flex;align-items:center}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.switch input{width:24px;height:24px;accent-color:var(--primary)}

/* stats */
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* list */
.tools{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:8px;overflow-x:auto}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:44px}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .filters button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .filters button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:transparent}}
.lead{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.lead .thumb{width:60px;height:72px}
.lead .body{min-width:0;flex:1}
.lead .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.tag.toscan{background:color-mix(in srgb,var(--violet) 16%,var(--surface));color:var(--primary)}
.tag.scanned{background:color-mix(in srgb,var(--teal) 20%,var(--surface));color:var(--ok)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* rescan */
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .25s}
.qrbox{background:#fff;border-radius:18px;padding:14px;display:grid;place-items:center;border:1px solid var(--line)}
.qrbox canvas{width:100%;max-width:min(100%,52vh);height:auto;aspect-ratio:1;image-rendering:pixelated;display:block}
.qrbox img{width:100%;max-height:52vh;object-fit:contain;display:block;border-radius:8px}
.notebox{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:10px;padding:12px 14px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px;z-index:80;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.banner{background:color-mix(in srgb,var(--coral) 18%,var(--surface));border:1px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:14px}
textarea.csv{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.notes-wrap textarea{padding-right:60px}
/* sync pill + login */
.sync{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;margin:-8px 0;font:inherit;color:inherit;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--ok)}.sync[data-s="busy"] i{background:var(--violet)}.sync[data-s="off"] i{background:var(--warm)}.sync[data-s="err"] i{background:var(--bad)}
.login{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;display:flex;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.login-in{margin:auto;width:100%;max-width:420px}
.login .brand{font-size:24px}
.msg-ok{color:var(--ok)}.msg-bad{color:var(--bad)}
.stats{gap:8px}.stat{padding:10px 8px;min-width:0}.stat span{font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Greenspan XP<small><button type="button" class="sync" id="syncBtn" data-s="off" aria-live="polite"><i></i><span id="syncT">Lead capture</span></button></small></div>
      <button class="who" id="who" type="button" aria-label="Change your name or show"><i id="whoI">?</i><span id="whoT">Set up</span></button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav aria-label="Sections">
    <button type="button" data-tab="capture"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>Capture</button>
    <button type="button" data-tab="leads"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Leads<span class="badge" id="bLeads"></span></button>
    <button type="button" data-tab="rescan"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 11h8M8 15h8"/></svg>Rescan<span class="badge" id="bScan"></span></button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';

/* ---------- Config ---------- */
var SUPABASE_URL='https://zhyiakcgajywbnjzqjth.supabase.co';
var SUPABASE_KEY='sb_publishable_mJPv05SVeyssDTArb_ZZjg_0E4lMaS1';   // publishable key: safe in the browser, protected by row level security
var BUCKET='badge-photos';
var VERSION='1.9';
var TEAM = ['Brook Tuffin','Dan Reed','Jamie Davenport','Max Huber','Nathaly Riano-Gomez','Rod Morton','Steven Howes'];  // Sales + Support staff from Events HQ
var INTERESTS = ['Puttify','Adventure Golf','Modular Golf','Signature Greens','Aerial courses','Play','Themed environments','FECs','Stadium and arena'];
var SUPPLIER_CATS = ['Materials','Lighting and AV','Technology','Signage and print','Equipment','Services','Other'];   // edit this list to change the supplier categories
var RATINGS = [{id:'hot',label:'Hot',c:'var(--hot)'},{id:'warm',label:'Warm',c:'var(--warm)'},{id:'cold',label:'Cold',c:'var(--cold)'}];
var DEFAULT_EVENT = 'IAAPA Expo 2026 Orlando';

/* ---------- Helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){try{return crypto.randomUUID()}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function tick(){return new Promise(function(r){setTimeout(r,0)})}
function iso(ms){return ms?new Date(ms).toISOString():null}
function msOf(s){return s?new Date(s).getTime():null}
function timeLabel(ts){
  var d=new Date(ts),now=new Date();
  var t=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===now.toDateString())return t;
  return d.toLocaleDateString([], {weekday:'short'})+' '+t;
}
function toast(msg){
  var old=$('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove()},2600);
}
function copyText(text){
  return new Promise(function(resolve){
    function fallback(){
      try{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();resolve(!!ok)}catch(e){resolve(false)}
    }
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){resolve(true)},fallback)}else fallback()}catch(e){fallback()}
  });
}

/* ---------- State ---------- */
var S={tab:'capture',settings:{},leads:[],pending:0,filter:'all',q:'',draft:null,rq:0,rqId:null,rqView:'clean',persisted:true};
function loadSettings(){try{return JSON.parse(localStorage.getItem('gsxp_lc_settings')||'{}')||{}}catch(e){return {}}}
function saveSettings(){try{localStorage.setItem('gsxp_lc_settings',JSON.stringify(S.settings))}catch(e){}}
S.settings=loadSettings();
if(!S.settings.event)S.settings.event=DEFAULT_EVENT;

var sb=null,session=null,started=false,rt=null,signed={};
var sync={busy:false,again:false,err:''};

/* ---------- Local store (IndexedDB): works offline, holds photos and unsynced changes ---------- */
var db=null,mem=[];
function openDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('gsxp-lead-capture',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('leads',{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){res(null)};
      r.onblocked=function(){res(null)};
    }catch(e){res(null)}
  });
}
function rp(req){return new Promise(function(res,rej){req.onsuccess=function(){res(req.result)};req.onerror=function(){rej(req.error)}})}
function store(mode){return db.transaction('leads',mode).objectStore('leads')}
function dbAll(){if(!db)return Promise.resolve(mem.slice());return rp(store('readonly').getAll())}
function dbGet(id){if(!db)return Promise.resolve(mem.find(function(x){return x.id===id})||null);return rp(store('readonly').get(id)).then(function(r){return r||null})}
function dbPut(l){
  if(!db){var i=mem.findIndex(function(x){return x.id===l.id});if(i<0)mem.push(l);else mem[i]=l;return Promise.resolve()}
  return rp(store('readwrite').put(l));
}
function dbDel(id){
  if(!db){mem=mem.filter(function(x){return x.id!==id});return Promise.resolve()}
  return rp(store('readwrite').delete(id));
}
async function refresh(){
  try{
    var all=await dbAll();
    S.pending=all.filter(function(l){return l.dirty||l.deleted}).length;
    S.leads=all.filter(function(l){return !l.deleted}).sort(function(a,b){return b.createdAt-a.createdAt});
  }catch(e){S.leads=[];S.pending=0}
}

/* ---------- Photo urls ---------- */

/* ---------- Sync ---------- */
async function pushOne(l){
  if(l.deleted){
    if(l.synced||l.photoPath){
      var d=await sb.from('leads').delete().eq('id',l.id);
      if(d.error)throw d.error;
      if(l.photoPath){try{await sb.storage.from(BUCKET).remove([l.photoPath])}catch(e){}}
    }
    await dbDel(l.id);return;
  }
  var path=l.photoPath||null;
  if(l.photo&&!l.photoUploaded){
    var np=l.id+'-'+Date.now()+'.jpg';
    var up=await sb.storage.from(BUCKET).upload(np,l.photo,{contentType:'image/jpeg',upsert:false});
    if(up.error)throw up.error;
    if(path){try{await sb.storage.from(BUCKET).remove([path])}catch(e){}}
    path=np;
  }
  var res=await sb.from('leads').upsert(toRow(l,path),{onConflict:'id'}).select('updated_at').single();
  if(res.error)throw res.error;
  var cur=await dbGet(l.id);
  if(!cur)return;
  cur.photoPath=path;cur.synced=true;
  if(cur.updatedAt===l.updatedAt){cur.dirty=false;cur.photoUploaded=true;cur.serverUpdatedAt=res.data.updated_at}
  await dbPut(cur);
}
async function pullAll(){
  var rows=[],from=0,step=1000;
  for(;;){
    var r=await sb.from('leads').select('*').order('created_at',{ascending:false}).range(from,from+step-1);
    if(r.error)throw r.error;
    rows=rows.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  var local=await dbAll(),byId={},remote={};
  local.forEach(function(l){byId[l.id]=l});
  for(var i=0;i<rows.length;i++){
    var row=rows[i];remote[row.id]=1;
    var l=byId[row.id];
    if(l&&(l.dirty||l.deleted))continue;
    if(l&&l.serverUpdatedAt===row.updated_at)continue;
    var nl=fromRow(row);
    if(l&&l.photo&&l.photoPath===nl.photoPath)nl.photo=l.photo;
    await dbPut(nl);
  }
  for(var j=0;j<local.length;j++){
    var x=local[j];
    if(x.synced&&!x.dirty&&!x.deleted&&!remote[x.id])await dbDel(x.id);
  }
}
async function syncNow(){
  if(!sb||!session)return;
  if(!navigator.onLine){paintSync();return}
  if(sync.busy){sync.again=true;return}
  sync.busy=true;sync.err='';paintSync();
  try{
    var all=await dbAll(),todo=all.filter(function(l){return l.dirty||l.deleted}),failed=0,lastErr='';
    for(var i=0;i<todo.length;i++){
      try{await pushOne(todo[i])}catch(e){failed++;lastErr=errText(e)}
    }
    await pullAll();
    await refresh();
    await ensureSigned();
    if(failed)sync.err=lastErr||'Some leads did not sync';
  }catch(e){sync.err=errText(e)||'Sync failed'}
  sync.busy=false;
  await refresh();
  paintSync();repaint();
  if(sync.again){sync.again=false;queueSync(300)}
}
var syncTimer=null;
function queueSync(delay){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,delay||200)}
function startRealtime(){
  if(rt||!sb)return;
  try{rt=sb.channel('leads-feed').on('postgres_changes',{event:'*',schema:'public',table:'leads'},function(){queueSync(400)}).subscribe()}catch(e){rt=null}
}
function stopRealtime(){if(rt&&sb){try{sb.removeChannel(rt)}catch(e){}}rt=null}

function paintSync(){
  var b=$('#syncBtn'),t=$('#syncT');if(!b||!t)return;
  var st,txt;
  if(!sb){st='off';txt='Saving on this phone only'}
  else if(!session){st='off';txt='Signed out'}
  else if(sync.busy){st='busy';txt='Syncing…'}

}

function drawScaled(img,maxSide,exact){

    smoothCtx(c).drawImage(img,0,0,c.width,c.height);return c;

  while(Math.max(tw,th)>maxSide){

async function scanRegions(canvas){

      var scales=i===0?[1,.6]:[1,1.6];

        t.width=Math.max(1,Math.round(w*sc));t.height=Math.max(1,Math.round(h*sc));   // one scratch canvas, resized each time
        cx.drawImage(canvas,x,y,w,h,0,0,t.width,t.height);

        var res=window.jsQR(id.data,t.width,t.height,{inversionAttempts:'attemptBoth'});

/* Second and third attempts for hard photos: stretch the contrast, then smooth out noise and stretch again. */

}
/* ZXing (the library most scanner apps use) as a stronger second reader. Loaded from the CDN, cached for offline use. */
var ZX_BASE='https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/';
var zxReady=null,zxStatus='not used',zxDeadAt=0;
function loadZX(){
  if(zxReady)return zxReady;
  if(zxDeadAt&&Date.now()-zxDeadAt<60000)return Promise.reject(new Error('unavailable'));
  zxReady=(async function(){
    if(!window.ZXingWASM)throw new Error('library not loaded');
    await window.ZXingWASM.prepareZXingModule({overrides:{locateFile:function(p){return ZX_BASE+p}},fireImmediately:true});
    zxStatus='ready';return true;
  })().catch(function(e){zxStatus='unavailable ('+errText(e)+')';zxDeadAt=Date.now();throw e});
  return zxReady;
}

    var r=await window.ZXingWASM.readBarcodes(id,{formats:['QRCode'],tryHarder:true,tryRotate:true,tryInvert:true,tryDownscale:true,maxNumberOfSymbols:1});

/* Crops taken straight from the full-size photo, so nothing is lost to shrinking. */
async function scanFullRes(full,engine){
  var d=dims(full),W=d.w,H=d.h;
  var regions=[[.45,.5,.55,.5],[.3,.4,.7,.6],[0,.45,1,.55]];
  var t=document.createElement('canvas'),cx=t.getContext('2d',{willReadFrequently:true}),found=null;
  try{
    for(var i=0;i<regions.length&&!found;i++){
      var x=Math.round(regions[i][0]*W),y=Math.round(regions[i][1]*H),w=Math.round(regions[i][2]*W),h=Math.round(regions[i][3]*H);
      var scales=[1,.6];
      for(var j=0;j<scales.length&&!found;j++){
        t.width=Math.max(1,Math.round(w*scales[j]));t.height=Math.max(1,Math.round(h*scales[j]));
        cx.imageSmoothingQuality='high';cx.drawImage(full,x,y,w,h,0,0,t.width,t.height);
        var id=cx.getImageData(0,0,t.width,t.height);
        if(engine==='jsqr'){var res=window.jsQR?window.jsQR(id.data,t.width,t.height,{inversionAttempts:'attemptBoth'}):null;if(res&&res.data)found=res.data}
        else found=await zxingRead(id);

/* Reads a badge photo. Fast strong reader first, slower fallbacks only if needed, and it gives up after a time limit. */
var BUDGET_MS=12000;
async function readBadge(file){
  var t0=Date.now(),img=null,big=null,info={qr:null,via:'',view:null,diag:''},blank=false,dm={w:0,h:0};
  zxStatus='not used';
  try{
    img=await loadImage(file);dm=dims(img);
    big=drawScaled(img,2200);
    blank=blankCheck(big);
    if(!blank){
      var stages=[
        ['native',function(){return detectNative(big)}],
        ['zxing',function(){return zxingRead(big)}],
        ['zxing-full',function(){return scanFullRes(img,'zxing')}],
        ['zxing-enhanced',async function(){
          for(var k=0;k<2;k++){var pc=enhance(big,k===1);await tick();var r=await zxingRead(pc);pc.width=pc.height=0;if(r)return r}
          return null}],
        ['jsqr',function(){return scanRegions(big)}],
        ['jsqr-full',function(){return scanFullRes(img,'jsqr')}],
        ['jsqr-enhanced',async function(){
          for(var k=0;k<2;k++){var pc=enhance(big,k===1);await tick();var r=await scanRegions(pc);pc.width=pc.height=0;if(r)return r}
          return null}]
      ];
      for(var i=0;i<stages.length;i++){
        if(Date.now()-t0>BUDGET_MS)break;
        var r=null;
        try{r=await stages[i][1]()}catch(e){r=null}
        if(r){info.qr=r;info.via=stages[i][0];break}
      }
    }
    if(!info.qr){info.view=await new Promise(function(res){big.toBlob(res,'image/jpeg',0.85)})}
  }catch(e){info.diag='error: '+errText(e)}
  finally{
    if(big){big.width=big.height=0}
    if(img&&img.close)try{img.close()}catch(x){}
  }
  var secs=((Date.now()-t0)/1000).toFixed(1);
  if(!info.diag)info.diag=(('BarcodeDetector' in window)?'native scanner':'no native scanner')+' · '+(window.jsQR?'jsQR loaded':'jsQR NOT loaded')+' · zxing '+zxStatus+' · '+dm.w+'x'+dm.h+' · pixels '+(blank?'BLANK':'ok')+' · '+(info.qr?'read via '+info.via:'not read')+' in '+secs+'s';
  return info;
}

function blankCheck(canvas){
  try{
    var w=Math.min(64,canvas.width),h=Math.min(64,canvas.height);
    var id=canvas.getContext('2d',{willReadFrequently:true}).getImageData(Math.floor((canvas.width-w)/2),Math.floor((canvas.height-h)/2),w,h).data;
    var min=255,max=0;
    for(var i=0;i<id.length;i+=4){var v=id[i]+id[i+1]+id[i+2];if(v<min)min=v;if(v>max)max=v}
    return max-min<6;       // no variation at all: the browser gave us an empty canvas
  }catch(e){return true}
}
function toBlobAsync(canvas,type,q){return new Promise(function(r){canvas.toBlob(r,type,q)})}
async function handlePhoto(d,file,host){
  var token=d.photoToken=(d.photoToken||0)+1;
  d.qr='';d.qrState='checking';d.diag='';d.debugFiles=null;d.photoUrl=d.photoUrl&&d.photoUrl.indexOf('blob:')===0?d.photoUrl:'';
  paintPhoto(host,d);
  var img=null,small=null;
  try{                                   // 1. a quick thumbnail so the person sees their photo straight away
    img=await loadImage(file);
    small=drawScaled(img,1280,true);
    d.photo=(await toBlobAsync(small,'image/jpeg',0.82))||file;
  }catch(e){d.photo=file}
  finally{
    if(small){small.width=small.height=0}
    if(img&&img.close)try{img.close()}catch(x){}
  }
  d.photoChanged=true;
  if(d.photoUrl&&d.photoUrl.indexOf('blob:')===0)try{URL.revokeObjectURL(d.photoUrl)}catch(e){}
  d.photoUrl=URL.createObjectURL(d.photo);
  paintPhoto(host,d);
  queueDecode(function(){return readBadge(file)}).then(function(res){onDecoded(d,token,file,res,host)}).catch(function(e){onDecoded(d,token,file,{qr:null,diag:'error: '+errText(e)},host)});
}
async function applyQrToLead(id,qr){
  var l=await dbGet(id);if(!l)return;
  l.qrPending=false;
  if(qr)l.qr=qr;
  l.updatedAt=Date.now();l.dirty=true;
  await dbPut(l);await refresh();repaint();queueSync(100);
  if(!isSup(l))toast(qr?'Badge QR code read.':'Couldn’t read the QR code on that badge. Its photo is saved.');
}
function onDecoded(d,token,file,res,host){
  if(d.photoToken!==token)return;                  // a newer photo has replaced this one
  d.qr=res.qr||'';d.qrState=res.qr?'ok':'fail';d.diag=res.diag||'';
  d.debugFiles=null;
  if(!res.qr){d.debugFiles=[file];if(res.view)d.debugFiles.push(new File([res.view],'scanner-view.jpg',{type:'image/jpeg'}))}
  if(d.saved){applyQrToLead(d.id,d.qr);return}      // the lead was already saved while we were reading
  if(host&&document.body.contains(host))paintPhoto(host,d);
  if(!res.qr&&d.contactType!=='supplier')toast('QR not readable. You can retake the photo or save it as is.');
}
async function resumePending(){                    // after a reload: finish reading any badge that was still being read
  var all=await dbAll();
  all.filter(function(l){return l.qrPending}).forEach(function(l){
    if(!l.photo){l.qrPending=false;dbPut(l);return}
    queueDecode(function(){return readBadge(l.photo)}).then(function(res){applyQrToLead(l.id,res.qr||'')}).catch(function(){applyQrToLead(l.id,'')});
  });
}
async function shareDebug(d){

    if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files,title:'Badge photo that would not scan'});return}

}

/* ---------- Dictation (browser speech recognition: Android Chrome, desktop Chrome/Edge, some iPhones) ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,recOn=false,recBtn=null;
function joinText(a,b){if(!b)return a;if(!a)return b.replace(/^\s+/,'');return /\s$/.test(a)||/^\s/.test(b)?a+b:a+' '+b}
function stopMic(){
  recOn=false;
  if(rec){try{rec.onend=null;rec.stop()}catch(e){}rec=null}
  if(recBtn){recBtn.setAttribute('aria-pressed','false');recBtn=null}
}
function toggleMic(btn,host,d){
  if(!SR)return;
  if(recOn){stopMic();return}
  var ta=$('[data-f="notes"]',host);if(!ta)return;
  var base=ta.value;
  rec=new SR();rec.lang=navigator.language||'en-GB';rec.continuous=false;rec.interimResults=true;
  recOn=true;recBtn=btn;btn.setAttribute('aria-pressed','true');
  rec.onresult=function(e){
    var fin='',live='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal)fin+=t;else live+=t;
    }
    if(fin)base=joinText(base,fin);
    ta.value=joinText(base,live);d.notes=ta.value;
  };
  rec.onerror=function(e){
    var er=e&&e.error;
    if(er==='not-allowed'||er==='service-not-allowed'){toast('Microphone is blocked. Allow it in your browser settings.');stopMic()}
    else if(er==='network'){toast('Dictation needs a signal. Try the keyboard mic instead.');stopMic()}
    else if(er==='audio-capture'){toast('No microphone found.');stopMic()}
  };
  rec.onend=function(){
    if(!recOn||!rec)return;
    try{rec.start()}catch(x){stopMic()}       // keeps listening through pauses until the mic is tapped again
  };
  try{rec.start()}catch(x){stopMic();toast('Couldn’t start dictation.')}
}
if(SR)document.documentElement.classList.add('has-dict');

  var l=q[S.rq],qrText=l.qr||'';
  var canClean=qrDrawable(qrText),u=urlFor(l);
  var view=(canClean&&S.rqView==='clean')?'clean':'photo';
  var r=RATINGS.find(function(x){return x.id===l.rating});
  var note=noteForScanner(l);
  v.innerHTML='<div class="stack">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Rescan</h2><span class="small muted">Badge '+(S.rq+1)+' of '+q.length+' waiting</span></div>'+
    '<div class="prog" aria-hidden="true"><i style="width:'+Math.round(((S.rq+1)/q.length)*100)+'%"></i></div>'+
    (canClean?'<div class="filters"><button type="button" data-rv="clean" aria-pressed="'+(view==='clean')+'">Clean code</button><button type="button" data-rv="photo" aria-pressed="'+(view==='photo')+'">Original photo</button></div>':'')+
    '<div class="qrbox" id="qrbox">'+(view==='clean'?'<canvas id="bigqr" aria-label="Badge QR code, redrawn for scanning"></canvas>':(u?'<img src="'+u+'" alt="Badge photo">':'<p class="small muted">'+((l.photo||l.photoPath)?'Photo is still loading. Check your connection.':'No photo saved for this lead.')+'</p>'))+'</div>'+
    '<p class="small muted">'+(view==='clean'?'Turn your screen brightness up, then scan this code with the licensed scanner.':(l.qr?'Scanning the original photo.':'No QR was read from this photo, so scan the original.'))+'</p>'+
    '<div><div style="font-weight:700;font-size:18px;font-family:var(--head)">'+esc(leadTitle(l))+'</div>'+(l.name&&l.company?'<div class="muted">'+esc(l.company)+'</div>':'')+
    (l.capturedBy?'<div class="small muted">Met by '+esc(l.capturedBy)+'</div>':'')+
    (r?'<div class="tags"><span class="tag" style="--c:'+r.c+'"><i></i>'+r.label+'</span></div>':'')+'</div>'+
    (note?'<div class="notebox">'+esc(note)+'</div><button class="btn block" type="button" id="copyNote">Copy notes for the scanner</button>':'')+
    '<div class="row2"><button class="btn" type="button" id="skip"'+(q.length<2?' disabled':'')+'>Skip</button><button class="btn primary" type="button" id="done">Scanned, next</button></div>'+
  '</div>';
  if(view==='clean'){var cv=$('#bigqr');if(!drawQR(cv,qrText)){S.rqView='photo';renderRescan();return}}
  $$('[data-rv]').forEach(function(b){b.onclick=function(){S.rqView=b.dataset.rv;renderRescan()}});
  var cn=$('#copyNote');if(cn)cn.onclick=async function(){toast(await copyText(note)?'Notes copied.':'Couldn’t copy. Select the text instead.')};
  $('#skip').onclick=function(){S.rq=(S.rq+1)%q.length;S.rqId=q[S.rq].id;renderRescan();v.scrollTop=0};
  $('#done').onclick=async function(){
    var now=Date.now();
    var nl=Object.assign({},l,{status:'scanned',scanSource:'Rescanned from photo',scannedAt:now,scannedBy:S.settings.name||'',updatedAt:now,dirty:true});
    await dbPut(nl);await refresh();S.rqId=null;renderAll();v.scrollTop=0;queueSync(100);
    toast(queue().length?'Marked as scanned.':'All caught up. Nothing left to rescan.');
  };
}

/* ---------- Export ---------- */
function csvCell(s){s=String(s==null?'':s);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function buildCSV(leads){
  var cols=['First Name','Last Name','Company Name','Lead Rating','Interests','Notes','Show','Captured By','Captured At','Badge QR Data','Printed Badge Code','Scanner Status'];
  var rows=[cols.map(csvCell).join(',')];
  leads.slice().sort(function(a,b){return a.createdAt-b.createdAt}).forEach(function(l){
    var parts=(l.name||'').trim().split(/\s+/),first=parts.shift()||'',last=parts.join(' ');
    rows.push([first,last,l.company,cap(l.rating),(l.interests||[]).join('; '),l.notes,l.event,l.capturedBy,new Date(l.createdAt).toISOString(),l.qr,l.badgeId,l.status==='scanned'?(l.scanSource||'Scanned'):'Not yet scanned'].map(csvCell).join(','));
  });
  return '\uFEFF'+rows.join('\r\n');
}
function buildSupplierCSV(list){
  var cols=['First Name','Last Name','Company Name','Category','Notes','Show','Captured By','Captured At'];
  var rows=[cols.map(csvCell).join(',')];
  list.slice().sort(function(a,b){return a.createdAt-b.createdAt}).forEach(function(l){
    var parts=(l.name||'').trim().split(/\s+/),first=parts.shift()||'',last=parts.join(' ');
    rows.push([first,last,l.company,l.supplierCat,l.notes,l.event,l.capturedBy,new Date(l.createdAt).toISOString()].map(csvCell).join(','));
  });
  return '\uFEFF'+rows.join('\r\n');
}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
async function saveCSV(fn,csv){
  var blob=new Blob([csv],{type:'text/csv'});
  try{
    var f=new File([blob],fn,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return 'shared'}
  }catch(e){if(e&&e.name==='AbortError')return 'cancelled'}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return 'downloaded';
  }catch(e){return 'fail'}
}
function openExport(kind){
  var sup=kind==='supplier';
  var all=S.leads.filter(function(l){return sup?isSup(l):!isSup(l)}),fresh=all.filter(function(l){return !l.exportedAt});
  openSheet(sup?'Export suppliers':'Export leads',function(body){
    body.innerHTML='<div class="stack">'+
      (sup?'<p class="muted small">Exports everyone’s supplier contacts as a separate CSV. These are not for HubSpot. “Not yet exported” is shared across the team, so nobody exports the same supplier twice.</p>':
      '<p class="muted small">Exports everyone’s leads as a CSV you can import into HubSpot. Supplier contacts are never included. “Not yet exported” is shared across the team, so nobody exports the same lead twice.</p>')+
      '<button class="btn primary block" type="button" id="x-new"'+(fresh.length?'':' disabled')+'>Not yet exported ('+fresh.length+')</button>'+
      '<button class="btn block" type="button" id="x-all">'+(sup?'All suppliers (':'All leads (')+all.length+')</button>'+
      '<div id="x-fallback"></div></div>';
    async function mark(set){
      var now=Date.now();
      for(var i=0;i<set.length;i++){await dbPut(Object.assign({},set[i],{exportedAt:now,updatedAt:now,dirty:true}))}
      await refresh();queueSync(100);
    }
    function showCopy(set,csv){
      var fb=$('#x-fallback',body);
      fb.innerHTML='<div class="stack"><p class="small muted">Couldn’t save a file here. Copy the CSV and paste it into a note or email to yourself.</p><textarea class="csv" readonly>'+esc(csv)+'</textarea><button class="btn block" type="button" id="x-copy">Copy CSV</button></div>';
      $('#x-copy',fb).onclick=async function(){var ok=await copyText(csv);if(ok){await mark(set);toast('CSV copied.')}else toast('Couldn’t copy. Select the text instead.')};
    }
    function run(set){
      if(!set.length)return;
      var csv=sup?buildSupplierCSV(set):buildCSV(set),fn=(sup?'suppliers-':'leads-')+(slug(S.settings.event)||'show')+'-'+new Date().toISOString().slice(0,10)+'.csv';
      saveCSV(fn,csv).then(async function(r){
        if(r==='cancelled')return;
        if(r==='fail'){showCopy(set,csv);return}
        await mark(set);closeSheet();renderAll();toast(r==='shared'?'Export shared.':'Export saved.');
      });
    }
    $('#x-new',body).onclick=function(){run(fresh)};
    $('#x-all',body).onclick=function(){run(all)};
  });
}

/* ---------- Sign in ---------- */
function showLogin(){
  if($('#login'))return;
  var el=document.createElement('div');el.id='login';el.className='login';
  el.innerHTML='<div class="login-in"><div class="brand" style="margin-bottom:18px">Greenspan XP<small>Lead capture</small></div><div id="loginBody"></div></div>';
  document.body.appendChild(el);
  loginEmailStep();
}
function hideLogin(){var l=$('#login');if(l)l.remove()}
function loginMsg(text,bad){var m=$('#l-msg');if(m){m.textContent=text||'';m.className='small '+(bad?'msg-bad':'msg-ok')}}
function niceAuthError(e){
  var t=errText(e);
  if(/invalid login credentials/i.test(t))return 'Email or password is wrong.';
  if(/signups? not allowed|not allowed for otp|user not found/i.test(t))return 'That email isn’t on the team list yet.';
  if(/rate limit|too many|seconds/i.test(t))return 'Too many emails sent. Wait a minute, then try again.';
  if(/expired|invalid/i.test(t))return 'That code didn’t work. Check it, or ask for a new one.';
  return t||'Something went wrong. Try again.';
}
function loginLinkStep(){
  var b=$('#loginBody');if(!b)return;
  b.innerHTML='<div class="stack"><h2>Email sign-in</h2><p class="muted small">Use your work email. We’ll email you a sign-in link and a code.</p>'+
    '<div class="field"><label for="l-email">Email</label><input type="email" id="l-email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" value="'+esc(S.settings.email||'')+'"></div>'+
    '<button class="btn primary block" id="l-send" type="button">Email me a sign-in link</button>'+
    '<p class="small" id="l-msg" role="status"></p>'+
    '<button class="link-btn" id="l-have" type="button">I already have a code</button> <button class="link-btn" id="l-pw" type="button">Use a password instead</button></div>';
  if(!sb)loginMsg('Sign-in isn’t available offline. Connect to the internet and reload.',true);
  $('#l-send').onclick=async function(){
    var em=$('#l-email').value.trim().toLowerCase();
    if(!em||em.indexOf('@')<1){loginMsg('Enter your email address.',true);return}
    if(!sb){return}
    var btn=$('#l-send');btn.disabled=true;loginMsg('Sending…');
    try{
      var r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
      if(r.error)throw r.error;
      S.settings.email=em;saveSettings();loginCodeStep(em);
    }catch(e){loginMsg(niceAuthError(e),true);btn.disabled=false}
  };
  $('#l-have').onclick=function(){var em=$('#l-email').value.trim().toLowerCase();if(!em){loginMsg('Enter your email first.',true);return}S.settings.email=em;saveSettings();loginCodeStep(em)};
  $('#l-pw').onclick=loginEmailStep;
}
function loginEmailStep(){
  var b=$('#loginBody');if(!b)return;
  b.innerHTML='<div class="stack"><h2>Sign in</h2><p class="muted small">Use the email and password you were given.</p>'+
    '<div class="field"><label for="l-email">Email</label><input type="email" id="l-email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="'+esc(S.settings.email||'')+'"></div>'+
    '<div class="field"><label for="l-pass">Password</label><input type="password" id="l-pass" autocomplete="current-password"></div>'+
    '<button class="btn primary block" id="l-signin" type="button">Sign in</button>'+
    '<p class="small" id="l-msg" role="status"></p>'+
    '<button class="link-btn" id="l-link" type="button">Email me a sign-in link instead</button></div>';
  if(!sb)loginMsg('Sign-in isn’t available offline. Connect to the internet and reload.',true);
  async function go(){
    var em=$('#l-email').value.trim().toLowerCase(),pw=$('#l-pass').value;
    if(!em||em.indexOf('@')<1){loginMsg('Enter your email address.',true);return}
    if(!pw){loginMsg('Enter your password.',true);return}
    if(!sb)return;
    var btn=$('#l-signin');btn.disabled=true;loginMsg('Signing in…');
    try{
      var r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error)throw r.error;
      S.settings.email=em;saveSettings();
    }catch(e){loginMsg(niceAuthError(e),true);btn.disabled=false}
  }
  $('#l-signin').onclick=go;
  $('#l-pass').onkeydown=function(e){if(e.key==='Enter')go()};
  $('#l-link').onclick=loginLinkStep;
}
function loginCodeStep(em){
  var b=$('#loginBody');if(!b)return;
  b.innerHTML='<div class="stack"><h2>Check your email</h2><p class="muted small">We sent a link to '+esc(em)+'. On an iPhone, using the home screen app, enter the code from that email here instead of tapping the link.</p>'+
    '<div class="field"><label for="l-code">Code from the email</label><input type="text" id="l-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></div>'+
    '<button class="btn primary block" id="l-verify" type="button">Sign in</button>'+
    '<p class="small" id="l-msg" role="status"></p>'+
    '<button class="link-btn" id="l-back" type="button">Use a different email</button></div>';
  $('#l-back').onclick=loginLinkStep;
  $('#l-verify').onclick=async function(){
    var code=$('#l-code').value.replace(/\s+/g,'');
    if(code.length<6){loginMsg('Enter the code from the email.',true);return}
    var btn=$('#l-verify');btn.disabled=true;loginMsg('Checking…');
    try{
      var r=await sb.auth.verifyOtp({email:em,token:code,type:'email'});
      if(r.error)throw r.error;
    }catch(e){loginMsg(niceAuthError(e),true);btn.disabled=false}
  };
}
function afterLogin(){
  hideLogin();
  if(!started){started=true;startRealtime()}
  queueSync(50);
  if(!S.settings.name&&!$('#sheet'))openSetup(true);
  paintSync();
}

/* ---------- Shell ---------- */
var wl=null;
async function wake(on){
  try{
    if(on){if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',function(){wl=null})}}
    else if(wl){await wl.release();wl=null}
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    if(S.tab==='rescan')wake(true);
    queueSync(200);
  }
});
window.addEventListener('online',function(){paintSync();queueSync(300)});
window.addEventListener('offline',paintSync);
setInterval(function(){if(document.visibilityState==='visible')queueSync(0)},45000);

function paintChrome(){
  var n=S.settings.name||'';
  $('#whoI').textContent=n?n.charAt(0).toUpperCase():'?';
  $('#whoT').textContent=n?(n+' · '+(S.settings.event||'')):'Set up';
  var c=counts();
  $('#bLeads').textContent=c.all?String(c.all):'';
  $('#bScan').textContent=c.toscan?String(c.toscan):'';
  $$('nav button').forEach(function(b){if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  paintSync();
}
function renderAll(){
  stopMic();
  paintChrome();
  if(S.tab==='capture')renderCapture();else if(S.tab==='leads')renderLeads();else renderRescan();
  wake(S.tab==='rescan');
}
/* Called after a background sync: refresh numbers without disturbing what the person is typing. */
function repaint(){
  paintChrome();
  var st=$('#stats');if(st&&S.tab==='capture')st.innerHTML=statsHTML(counts());
  if($('#sheet'))return;
  var ae=document.activeElement;
  if(S.tab==='leads'&&!(ae&&ae.id==='search'))renderLeads();
  else if(S.tab==='rescan')renderRescan();
}
$$('nav button').forEach(function(b){b.onclick=function(){
  if(S.tab===b.dataset.tab&&b.dataset.tab!=='capture')return;
  S.tab=b.dataset.tab;if(S.tab==='rescan'){S.rq=0;S.rqId=null}renderAll();$('#view').scrollTop=0;
}});
$('#who').onclick=function(){openSetup(false)};
$('#syncBtn').onclick=function(){sync.err='';queueSync(0);toast(session?'Syncing…':'Sign in to sync.')};

async function init(){
  db=await openDB();
  if(!db)S.persisted=false;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await refresh();
  renderAll();
  try{
    if(window.supabase&&window.supabase.createClient){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    }
  }catch(e){sb=null}
  paintSync();
  setTimeout(function(){if(navigator.onLine)loadZX().catch(function(){})},1500);
  setTimeout(resumePending,2500);
  if(!sb){if(!S.settings.name)openSetup(true);return}
  sb.auth.onAuthStateChange(function(ev,s){
    setTimeout(function(){
      if(ev==='SIGNED_OUT'){session=null;stopRealtime();started=false;showLogin();paintSync()}
      else if(ev==='SIGNED_IN'&&s){session=s;afterLogin()}
      else if(s){session=s}
    },0);
  });
  try{
    var g=await sb.auth.getSession();
    session=(g&&g.data&&g.data.session)||null;
  }catch(e){session=null}
  if(session)afterLogin();
  else{
    showLogin();
  }
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
}
init();
})();
</script>
